[tool.coverage.run]
omit = [
    "peterbecom/minimalcss/*",
    "*/migrations/*",
    "peterbecom/plog/management/*",
    "*/management/commands/*",
    "peterbecom/bayes/*",
    "peterbecom/settings/*",
    "peterbecom/chiveproxy/*",
    "peterbecom/conftest.py",
    "*/test_*.py",
]
