[tool.ruff]
exclude = [
    'peterbecom/*/migrations/*',
    'peterbecom/settings/__init__.py',
    'peterbecom/settings/local.py',
    'peterbecom/wsgi.py',
]
line-length = 88

[tool.ruff.lint]
ignore = [
    "N999",  # Invalid module name (e.g. django management commands)
]

[project]
name = "django-peterbecom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "backoff==2.2.1",
    "bleach==6.4.0",
    "brotli==1.2.1",
    "cachetools==7.2.7",
    "cssselect==1.6.0",
    "delegator-py==0.1.1",
    "dj-database-url==3.1.2",
    "django-redis==7.0.0",
    "django==6.1.2",
    "feedparser==6.0.14",
    "ftfy==6.3.1",
    "geoip2==5.3.0",
    "gunicorn==25.3.0",
    "huey==3.5.3",
    "ipaddress==1.0.23",
    "jsonschema==4.26.0",
    "keycdn==0.4.3",
    "lxml==6.1.3",
    "markdown==3.11.2",
    "mock==5.2.0",
    "mozilla-django-oidc==5.0.2",
    "nltk==3.10.4",
    "optisorl==0.2.1",
    "pillow==13.0.0",
    "profanity==1.1",
    "ptyprocess==0.7.0",
    "py-avataaars==1.1.2",
    "pyquery==2.1.0",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "pytest-watch>=4.2.0",
    "python-dateutil==2.9.0.post0",
    "python-decouple==3.8",
    "pytz==2026.6",
    "redis==8.1.0",
    "requests-mock==1.12.1",
    "requests==2.34.2",
    "rollbar==1.5.0",
    "ruff==0.17.3",
    "sorl-thumbnail==13.4.0",
    "sql-metadata==3.0.1",
    "tomli==2.5.0",
    "xmltodict==1.0.4",
    "zope-structuredtext==6.0",
    "zopfli==0.4.3",
    "ffmpeg-python==0.2.0",
    "psycopg[binary,pool]>=3.3.4",
    "crawlerdetect==0.4.2",
    "anthropic==2.3.0",
    "openai==3.35.1",
    "zstandard>=0.25.0",
